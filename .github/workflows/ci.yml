name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Start disposable MongoDB replica set
      run: |
        docker run -d --name atlas-ci-mongo --label io.github.alaneel.atlas.task=atlas-ai-ci -p 127.0.0.1:28027:27017 mongo:7.0 --replSet atlas-rs --bind_ip_all --setParameter enableTestCommands=1
        for attempt in $(seq 1 40); do
          if docker exec atlas-ci-mongo mongosh --quiet --eval 'try { rs.status() } catch(e) { if(e.code === 94) rs.initiate({_id:"atlas-rs",members:[{_id:0,host:"localhost:27017"}]}); else throw e; } if(!db.hello().isWritablePrimary) quit(1);'; then
            exit 0
          fi
          sleep 1
        done
        docker logs atlas-ci-mongo
        exit 1

    - name: Run tests
      run: mvn -B verify
      env:
        ATLAS_MONGO_FAILPOINTS: "true"
        ATLAS_MONGO_URI: mongodb://127.0.0.1:28027/atlas_context_test?replicaSet=atlas-rs&directConnection=true
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Read-only explanation HTTP demonstration
      run: python3 scripts/explanation-demo.py --mongo-container atlas-ci-mongo --owner-value atlas-ai-ci

    - name: Evaluation report contracts (offline)
      run: |
        python3 -m unittest discover -s scripts/tests
        python3 -m py_compile scripts/run-cross-event-eval.py scripts/cross_event_report.py scripts/build-cross-event-demo.py scripts/build-human-review.py scripts/score-human-review.py scripts/human_review.py scripts/human_review_ui.py python_src/trading_dashboard.py

    - name: Remove owned test database container
      if: always()
      run: docker rm -f atlas-ci-mongo || true

    - name: Upload acceptance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: atlas-acceptance
        path: |
          target/surefire-reports
          target/site/jacoco
          target/atlas-*.json

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./target/site/jacoco/jacoco.xml
        fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Checkstyle
      run: mvn checkstyle:check
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: atlas-trade-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.streamlit
        push: false
        tags: atlas-control-room:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK and Maven cache
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Resolve Maven dependencies
      run: mvn dependency:go-offline -B

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
