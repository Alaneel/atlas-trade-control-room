spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/atlas_trade_control}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

logging:
  level:
    root: WARN
    com.gic: INFO

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      show-details: never
