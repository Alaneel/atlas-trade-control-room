services:
  mongodb:
    command: ["mongod", "--replSet", "atlas-rs", "--bind_ip_all"]
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: atlas_reliable
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_reliable_data:/data/db
    networks:
      - atlas-network
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status() } catch (e) { if (e.code === 94) rs.initiate({_id:"atlas-rs",members:[{_id:0,host:"mongodb:27017"}]}); else throw e; } if (!db.hello().isWritablePrimary) quit(1);'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILE=prod
      - MONGODB_URI=mongodb://mongodb:27017/atlas_reliable?replicaSet=atlas-rs&directConnection=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
      - ATLAS_EXECUTION_SCENARIO=${ATLAS_EXECUTION_SCENARIO:-SUCCESS}
      - ATLAS_AI_EXPLANATIONS_ENABLED=${ATLAS_AI_EXPLANATIONS_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    environment:
      - BACKEND_API_URL=http://backend:8080
      - DEMO_MODE=false
    ports:
      - "127.0.0.1:${STREAMLIT_SERVER_PORT:-8501}:8501"
    depends_on:
      - backend
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  mongodb_reliable_data:
  redis_data:
